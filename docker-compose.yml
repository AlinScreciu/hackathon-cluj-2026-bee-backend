services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radarul
      POSTGRES_USER: radarul
      POSTGRES_PASSWORD: radarul
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radarul -d radarul"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
